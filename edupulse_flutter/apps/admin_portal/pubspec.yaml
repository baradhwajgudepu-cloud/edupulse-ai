name: admin_portal
resolution: workspace
description: EduPulse Admin Portal - Administrative control center for school ERP.
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  equatable: ^2.0.6
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  file_picker: ^6.1.1
  geolocator: ^13.0.1
  firebase_core: ^3.6.0

  # Workspace Packages
  edupulse_core:
    path: ../../packages/edupulse_core
  edupulse_config:
    path: ../../packages/edupulse_config
  edupulse_assets:
    path: ../../packages/edupulse_assets
  edupulse_models:
    path: ../../packages/edupulse_models
  edupulse_network:
    path: ../../packages/edupulse_network
  edupulse_api:
    path: ../../packages/edupulse_api
  edupulse_auth:
    path: ../../packages/edupulse_auth
  edupulse_theme:
    path: ../../packages/edupulse_theme
  edupulse_localization:
    path: ../../packages/edupulse_localization
  edupulse_ui:
    path: ../../packages/edupulse_ui

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  freezed: ^2.5.8
  json_serializable: ^6.9.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

