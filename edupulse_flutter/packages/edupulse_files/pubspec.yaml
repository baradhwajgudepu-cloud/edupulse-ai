name: edupulse_files
resolution: workspace
description: Shared file downloader, file viewer, share service, and storage management for EduPulse AI.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  edupulse_core:
    path: ../edupulse_core
  edupulse_network:
    path: ../edupulse_network
  open_filex: ^4.4.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
